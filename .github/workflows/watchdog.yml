name: Watchdog (missed runs / broken sources)
on:
  schedule:
    - cron: '11 16 * * *'          # daily 16:11 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar watchdog
