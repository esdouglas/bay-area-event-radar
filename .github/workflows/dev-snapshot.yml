name: Dev snapshot (collector development)
# Fires only when .github/dev-snapshot-request changes on radar-v2. Runs the requested sources with
# --dry-run (prints events per source) and pushes every fetched page to a throwaway tag dev-snap-<run>
# so parsers can be developed against real pages from a runner. Delete the tags when done.
on:
  push:
    branches: [radar-v2]
    paths: ['.github/dev-snapshot-request']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RADAR_FETCH_RECORD: ${{ github.workspace }}/snap
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/dev_snapshot.py .github/dev-snapshot-request
      - name: Push recorded pages to tag dev-snap-${{ github.run_id }}
        if: always()
        run: |
          mkdir -p snap && cd snap
          git init -q && git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "dev snapshot ${{ github.run_id }}" --allow-empty
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/tags/dev-snap-${{ github.run_id }}"
