name: Historical benchmark with Wayback checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar benchmark --live
      - run: bash scripts/commit_data.sh "${{ github.ref_name }}" "Radar: benchmark with live Wayback checks"
