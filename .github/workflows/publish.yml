name: Refresh and publish radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh, validate and save against latest registry
        env:
          RADAR_COLLECT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: bash refresh-and-save.sh
      - name: Retain exact collection evidence
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: collection-evidence-${{ github.run_id }}
          path: .capture/
          include-hidden-files: true
          retention-days: 90
      - run: mkdir -p _site && cp index.html inventory.html radar.ics health.json _site/ && cp data/*.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
