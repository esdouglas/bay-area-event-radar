# Historical discoverability benchmark.
#
# The question for each event is NOT "can we find it today?" but "would the registered collectors have
# encountered it, without being told the artist's name, before it happened?"  Evidence classes:
#   proven       a timestamped artifact from a source that is in the registry shows the event was posted
#                before the date (Google Calendar CREATED, The Events Calendar date_utc, Squarespace
#                addedOn, a Wayback snapshot of the source page). lead_days is measured from that stamp.
#   plausible    the venue/presenter is a working registry source that lists all its shows, but no
#                pre-dated artifact was captured (the show is past and the page no longer lists it).
#   unverifiable the venue is not a registry source, or the source is blocked / unreachable, so the
#                system as built would have had to rely on an aggregator or would have missed it.
# `announced` is a timestamp a primary source gave us; `evidence` says where it came from. Nothing here
# is inferred from present-day search results. `wayback` entries are checked by `benchmark --live`.

