# ============================================================ aggregators (recall insurance)
- id: songkick-bay-area
  name: Songkick SF Bay Area metro
  kind: aggregator
  method: songkick
  url: https://www.songkick.com/metro-areas/26330-us-sf-bay-area
  max_pages: 25
  category: music
  expected_coverage: ~1,100 upcoming concerts incl. Freight & SFJAZZ listings we cannot fetch directly
  notes: >
    Songkick's origin answers HTTP 406 to automated clients; only pages already in its CDN cache
    (X-Cache HIT, ~6 h TTL, warmed by real visitors) are served. Each run therefore gets a random
    subset of pages (about half on 2026-10-25) and coverage accumulates across runs. An official
    Songkick API key would make this complete; access is by application only.

- id: dice-sf
  name: Dice SF music
  kind: aggregator
  method: dice
  urls:
    - https://dice.fm/browse/sanfrancisco-60dee10ce5e339918757f0db/music/gig
    - https://dice.fm/browse/san-francisco
  category: music
  expected_coverage: Dice-ticketed shows (Eli's, Stork Club, Kilowatt, Thee Parkside, etc.)

- id: eventbrite-east-bay
  name: Eventbrite via official API (organizers/venues/events)
  kind: aggregator
  method: eventbrite_api
  organizers: []
  venues: []
  events: []
  category: mixed
  enabled: false
  notes: >
    Enable once EVENTBRITE_TOKEN exists. Eventbrite's web pages and front-end search API answer
    HTTP 405 to GitHub runners (verified 2026-10-25); the official API host is reachable (401 without token).

- id: eventbrite-web-search
  name: Eventbrite front-end search (blocked from GitHub)
  kind: aggregator
  method: eventbrite_web
  url: https://www.eventbrite.com/
  places: ["85922583", "85922177"]
  tags: ["EventbriteCategory/103", "EventbriteCategory/105"]
  max_pages: 15
  category: mixed
  enabled: false
  notes: Works from residential IPs (610 music events in 13 pages on 2026-10-25); 405 from GitHub runners.

- id: allevents-el-cerrito
