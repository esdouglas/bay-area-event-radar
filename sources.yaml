# Source registry. One entry per collection target. Health (last_ok, failures, counts) lives in
# data/source_health.json; per-run outcomes in data/runs/. Adding a source = adding an entry here.
#
# Fields
#   id, name              identifiers
#   kind                  venue | presenter | aggregator | calendar | theater | radio | festival
#   method                collector (see radar/collectors/__init__.py)
#   url / urls            what to fetch; "{page}" is expanded 1..max_pages
#   frequency             every | 6h | 12h | daily | weekly   (how often this source is re-fetched)
#   venue: {name, city}   default venue for single-venue sources
#   category              music | theater | dance | arts | mixed
#   expected_coverage     what we believe this gives us (human note; the dashboard compares to reality)
#   notes                 verification notes: how it was confirmed, what blocks it, alternatives
#   enabled: false        kept in the registry so the gap stays visible, but not fetched

sources:

