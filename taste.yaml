  noise_other: {weight: -25, terms: [comedy, comedian, stand-up, standup, improv comedy, class, classes, lesson, lessons, workshop, masterclass, camp, clinic, jam session, open jam, slow jam, kids, children, family show, storytime, story time, lecture, talk, panel, book launch, book signing, reading, poetry slam, church service, worship, service, mass, auction, market, fair, expo, conference, summit, webinar, zoom, online, virtual, livestream, screening, film, movie, cinema, sports, game watch, playoff, football, basketball, soccer, hockey, baseball, wrestling, boxing, mma, run club, 5k, marathon, hike, cleanup, volunteer]}
