# ------------------------------------------------------------------ tiers
tiers:
  exceptional: 78   # immediate alert (rules-only scores also need a seed/legacy/psych-folk signal)
  strong: 55        # weekly digest
  inventory: 15     # browsable; below this is "noise" (still stored, hidden by default)
multi_source_bonus: 4      # each additional independent source adds this (capped at 12)
upcoming_14d_bonus: 3
