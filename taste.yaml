# Taste profile used by radar/rank.py (rules) and radar/enrich.py (model prompt).
# Weights are additive points on a 0-100 scale. Edit freely; nothing else needs to change.

principle: >
  Recall before precision. A foundational musician playing a $20 show in a 100-person room may be
  more important than a major touring artist playing an arena. Borderline candidates stay in the
  inventory; only obvious noise (karaoke, trivia, DJ nights, classes) is pushed down.

