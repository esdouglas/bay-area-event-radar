# ------------------------------------------------------------------ keyword neighbourhoods
# Matched against title + description + tags (folded, whole-word). Positive and negative.
keywords:
  roots_core: {weight: 22, terms: [old-time, old time, oldtime, appalachian, bluegrass, newgrass, jamgrass, stringband, string band, fiddle, fiddler, fiddlers, banjo, clawhammer, mandolin, dobro, flatpick, flatpicking, square dance, contra dance, cajun, zydeco, folk revival, traditional music, trad music, celtic, irish trad, scottish fiddle, shape note, gospel bluegrass, acoustic music, progressive acoustic, chamber folk]}
  roots_psych: {weight: 26, terms: [psych folk, psych-folk, psychedelic folk, freak folk, outsider folk, outsider, acid folk, cosmic american, cosmic country, weird folk, freak-folk, american primitive, primitive guitar, fingerstyle guitar, takoma]}
  roots_adjacent: {weight: 10, terms: [folk, americana, roots, singer-songwriter, singer songwriter, country, honky tonk, honky-tonk, western swing, blues, acoustic, gospel, rebetiko, balkan, klezmer, son jarocho, tejano, conjunto, flamenco, fado, chanson, tango]}
  jazz_core: {weight: 18, terms: [jazz, improvised, improvisation, improvising, avant-garde, avant garde, free jazz, creative music, new music, experimental, chamber jazz, solo piano, piano trio, saxophone, trumpet, vibraphone, bass clarinet, pedal steel]}
  theater_core: {weight: 14, terms: [world premiere, west coast premiere, premiere, revival, new play, pulitzer, tony award, obie, olivier, chekhov, ibsen, arthur miller, stoppard, shakespeare, beckett, pinter, sondheim, musical, play, drama, repertory, immersive, site-specific, one-night-only, one night only, limited run, limited engagement]}
  dance_arts: {weight: 10, terms: [contemporary dance, dance theater, ballet, choreograph, choreographer, interdisciplinary, multimedia, installation, design, architecture, sound art, puppetry, circus]}
  legacy: {weight: 14, terms: [legend, legendary, pioneer, pioneering, founding member, founder of, seminal, influential, 50th anniversary, 40th anniversary, farewell, final tour, last show, rare appearance, first bay area, only bay area, only california, exclusive, reunion]}
  intimacy: {weight: 5, terms: [house concert, living room, intimate, listening room, solo acoustic, duo, trio, in-store, in store, workshop performance, salon, parlor, parlour]}
  noise: {weight: -45, terms: [karaoke, trivia, open mic, open-mic, pub quiz, bingo, drag brunch, speed dating, networking, happy hour, watch party, fundraiser gala, silent disco, paint and sip, yoga, sound bath, meditation, bootcamp, fitness, networking, mixer, pre-show vip, vip experience, parking pass, parking, shuttle, meet and greet, soundcheck party]}
